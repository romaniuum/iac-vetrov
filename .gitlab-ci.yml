# все задачи на моём раннере
default:
  tags:
    - vetrov-09

stages:
  - proverka
  - stend

# не запускать, если менялась только документация
shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.sh"
        - .gitlab-ci.yml
  script:
    - echo "Вариант 09, слово cloudlab"
    - shellcheck --version
    # commands.sh — журнал команд, не скрипт; -x чтобы проверялся params.sh
    - find . -name '*.sh' ! -path ./work-01/commands.sh -print
    - find . -name '*.sh' ! -path ./work-01/commands.sh -exec shellcheck -x {} +

# проверка шаблонов cloud-init, relaxed — иначе ругается на длинные строки
yamllint:
  stage: proverka
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.yaml"
        - .gitlab-ci.yml
  script:
    - echo "Проверка YAML, вариант 09, слово cloudlab"
    - apk add --no-cache yamllint >/dev/null
    - yamllint --version
    - yamllint -d relaxed work-02/cloud-init.tpl.yaml hw-01/cloud-init.tpl.yaml

# заготовка: yc и профиль с ключом из переменной
.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_LAB"
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# по кнопке, ничего не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 09, слово cloudlab"
    - yc vpc network list

# по кнопке: стенд пр2 — создать, проверить, удалить
stend-p2:
  extends: .yc
  stage: stend
  when: manual
  variables:
    PREFIX: vetrov-09
    GREETING: cloudlab
    RUNNER_AFTER_SCRIPT_TIMEOUT: 15m
  script:
    - echo "Стенд второй работы из пайплайна, вариант 09, префикс $PREFIX, слово $GREETING"
    - ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
    - bash work-02/create.sh
    - bash work-02/check-lb.sh
  after_script:
    - export PATH=/usr/local/bin:$PATH
    - echo "Уборка стенда, префикс $PREFIX"
    - bash work-02/destroy.sh

# заготовка для Terraform: точка входа образа — сам terraform, а провайдер
# берём с зеркала Яндекса, реестр HashiCorp отсюда недоступен
.terraform:
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.tf"
        - "**/.terraform.lock.hcl"
        - .gitlab-ci.yml
  before_script:
    - |
      cat > /tmp/terraformrc <<'TFRC'
      provider_installation {
        network_mirror {
          url     = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      TFRC
    - export TF_CLI_CONFIG_FILE=/tmp/terraformrc

terraform-fmt:
  extends: .terraform
  stage: proverka
  script:
    - echo "Формат манифестов, вариант 09, слово cloudlab"
    - terraform version
    - terraform fmt -check -diff -recursive

# -backend=false: ставим провайдер, состояние для проверки не нужно
terraform-validate:
  extends: .terraform
  stage: proverka
  script:
    - echo "Разбор манифеста hw-02, вариант 09, слово cloudlab"
    - terraform -chdir=hw-02 init -backend=false -input=false
    - terraform -chdir=hw-02 validate
